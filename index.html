function icon(name,cls=''){return `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]||ICONS.info}</svg>`;}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function txt(value,max=8000){return typeof value==='string'?value.slice(0,max):'';}
function uid(){return 's-'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function validDate(value){return /^\d{4}-\d{2}-\d{2}$/.test(value)&&!Number.isNaN(Date.parse(value+'T12:00:00'))&&new Date(value+'T12:00:00').toISOString().slice(0,10)===value;}
function enumValue(value,values,fallback){return values.includes(value)?value:fallback;}
function cleanNum(value,max=10000000){if(value===''||value===null||value===undefined)return '';const n=Number(value);return Number.isFinite(n)&&n>=0?Math.min(max,n):'';}
function fmt(n,d=0){return new Intl.NumberFormat('en-US',{maximumFractionDigits:d}).format(n);}
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);}
function labelOf(options,value){return options.find(a=>a[0]===value)?.[1]||value;}
function options(values,current){return values.map(v=>{const [value,label]=Array.isArray(v)?v:[v,v];return `<option value="${esc(value)}" ${value===current?'selected':''}>${esc(label)}</option>`;}).join('');}

function normalizeSession(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw new Error('The file does not contain a valid session.');const p=raw.profile;if(!p||typeof p.name!=='string'||!p.name.trim())throw new Error('A customer name is required in the session.');

function gRecord(id){return session().gtt[id]||{status:'open',answer:'',owner:'',evidence:'',date:'',due:''};}
function gHasProof(v){return !!(v&&v.answer?.trim()&&v.owner?.trim()&&v.evidence?.trim()&&validDate(v.date)&&v.date<=today());}
function isStale(v){return !!(v?.date&&validDate(v.date)&&(new Date(today()+'T12:00:00')-new Date(v.date+'T12:00:00'))/86400000>90);}
function gClosed(id){const r=gRecord(id);return r.status==='na'&&r.answer.trim()&&r.owner.trim()||r.status==='evidenced'&&gHasProof(r)&&!isStale(r);}

function requiredGtt(){const selected=selectedOpps();if(!selected.length)return [];const ids=new Set(['collectors','isolation','residency','boundaries','proof','service']);selected.forEach(o=>o.proof.forEach(id=>ids.add(id)));return GTT.filter(q=>ids.has(q.id));}
function pilotGate(){const required=requiredGtt();const missing=required.filter(q=>!gClosed(q.id));const done=PILOT_TASKS.every(t=>session().pilot.tasks[t.id]?.done&&session().pilot.tasks[t.id]?.owner?.trim());const defined=!!(session().pilot.scope.trim()&&session().pilot.criteria.trim()&&session().pilot.owner.trim());if(!selectedOpps().length)return {title:'Choose an evaluation use case',tone:'',missing,ready:false};if(missing.length)return {title:`${missing.length} product validation items remain`,tone:'amber',missing,ready:false};if(!done||!defined)return {title:'Complete the pilot definition',tone:'amber',missing,ready:false};return {title:'Ready for joint pilot review',tone:'green',missing,ready:true};}

function panelHead(title,description,action='',id='',actionText='View all'){return `<div class="card-head"><div><h2>${title}</h2>${description?`<p>${description}</p>`:''}</div>${action?`<button class="head-link" data-action="${action}" data-id="${id}">${actionText}${icon('arrow')}</button>`:''}</div>`;}
function footer(){return `<footer class="app-footer"><span>HALO-specific presales workspace · AI-assisted software and discovery content · Human validation required.</span><span><button class="head-link" data-action="sources">Product source & limitations ${icon('link')}</button></span></footer>`;}
function render(){hideTooltip();const s=session(),m=metrics();root.innerHTML=`<a class="skip-link" href="#main-content">Skip to workspace</a><div class="shell"><aside class="sidebar ${ui.mobile?'mobile-open':''}" aria-label="Primary navigation"><div class="brand" role="button" tabindex="0" data-action="nav" data-id="overview" aria-label="HALO overview"><span class="gtt">GTT</span><i class="brand-rule"></i><div class="brand-name">Defense<span>HALO</span></div></div><div class="side-eyebrow">PRESALES NAVIGATOR</div><nav class="nav-list">${NAV.map(([id,label,ic])=>`<button class="nav ${ui.route===id?'active':''}" data-action="nav" data-id="${id}" ${ui.route===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span>${id==='discovery'?`<span class="nav-number">${m.complete}/${CUSTOMER.length}</span>`:id==='readiness'?`<span class="nav-number">${m.open}</span>`:''}</button>`).join('')}</nav><div class="side-bottom"><div class="halo-orbit">${icon('shieldcheck')}</div><div class="side-title">Ask better.<br>Validate more.<br><span>Build confidence.</span></div><div class="local-card"><strong><span class="dot"></span>Local workspace</strong><span id="save-status">${storageAvailable?'Saved in this browser':'Storage unavailable · export a backup'}</span><div style="margin-top:5px">No HALO connection. No data is sent.</div></div></div></aside><div class="workspace"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="icon-btn mobile-menu" data-action="mobile" aria-label="Toggle navigation">${icon('menu')}</button><div><div class="product-title">HALO Presales Navigator <span class="badge">INTERACTIVE WORKSPACE</span></div><div class="top-sub">Discover the customer. Validate the product. Define the proof.</div></div></div><div class="top-actions"><button class="icon-btn top-secondary" data-action="search" aria-label="Search questions and pages" title="Search (Ctrl+K)">${icon('search')}</button>${button('Talk track','talk','','ghost top-secondary','book')}${button('Save','save','','ghost top-secondary','save')}${button('Executive brief','nav','output','primary','file')}<div class="avatar" title="Presales engineer">SE</div></div></header>${s.demo?`<div class="demo-line">${icon('info')}<strong>ILLUSTRATIVE DEMO</strong> Fictional customer data. No verified customer-specific HALO fit.<span>Use “New customer” for a blank engagement.</span></div>`:`<div class="demo-line" style="background:#0b1710;border-color:#213626">${icon('lock')} Browser-local working notes · Do not enter passwords, raw logs or confidential production data.</div>`}<main class="content" id="main-content" tabindex="-1">${renderPage()}${footer()}</main></div></div>`;}
function renderPage(){switch(ui.route){case 'discovery':return discoveryPage();case 'readiness':return readinessPage();case 'stack':return stackPage();case 'executive':return executivePage();case 'opportunities':return opportunitiesPage();case 'pilot':return pilotPage();case 'output':return outputPage();default:return overviewPage();}}
function sessionBar(){const s=session();return `<section class="session-bar" aria-label="Customer engagement"><div class="customer-field"><label for="session-select">Active engagement</label><select id="session-select" data-bind="session">${store.sessions.map(x=>`<option value="${esc(x.id)}" ${x.id===s.id?'selected':''}>${esc(x.profile.name)}${x.demo?' · Demo':''}</option>`).join('')}</select></div><div class="session-industries"><label for="profile-industry">Industry</label><select id="profile-industry" data-profile="industry">${options(INDUSTRIES,s.profile.industry)}</select></div><div class="session-industries"><label for="profile-size">Environment size</label><select id="profile-size" data-profile="size">${options(SIZES,s.profile.size)}</select></div><div class="stage-field"><label for="profile-stage">Engagement stage</label><select id="profile-stage" data-profile="stage">${options(STAGES,s.profile.stage)}</select></div>${button('Edit profile','profile','','','edit')}</section>`;}
function statsHTML(){const m=metrics();return `<section class="stats" aria-label="Engagement progress"><div class="card stat"><div class="stat-label">Discovery completion ${help('Completion, not security posture','Counts documented answers, including explained exclusions, divided by 16 discovery questions. This is not a security or exposure score.')}</div><div class="stat-value">${m.percent}<small>%</small></div><div class="stat-desc">${m.complete} of ${CUSTOMER.length} questions documented</div><div class="progress"><span style="width:${m.percent}%"></span></div></div><div class="card stat"><div class="stat-label">GTT product evidence ${icon('shieldcheck')}</div><div class="stat-value">${m.evidence}<small> / ${GTT.length}</small></div><div class="stat-desc">Current, recorded evidence · not an attestation</div><div class="progress"><span style="width:${m.evidence/GTT.length*100}%"></span></div></div><div class="card stat"><div class="stat-label">Customer-reported gaps ${icon('target')}</div><div class="stat-value">${m.gaps}<small> identified</small></div><div class="stat-desc">${m.partial} additional areas partially addressed</div></div><div class="card stat"><div class="stat-label">Pilot definition ${icon('flag')}</div><div class="stat-value">${m.tasks}<small> / ${PILOT_TASKS.length}</small></div><div class="stat-desc">Planning checklist, not authorization to act</div><div class="progress"><span style="width:${m.tasks/PILOT_TASKS.length*100}%"></span></div></div></section>`;}
function compactCustomer(ids){return ids.map(id=>{const q=CUSTOMER.find(q=>q.id===id);return `<button class="question-row" data-action="customer-question" data-id="${id}"><span class="status-square ${cAnswered(id)?'filled':''}">${cAnswered(id)?icon('check'):''}</span><span class="row-title">${esc(q.title)}</span>${cPill(id)}${icon('chevron')}</button>`;}).join('');}
function compactGtt(ids){return ids.map(id=>{const q=GTT.find(q=>q.id===id);return `<button class="question-row" data-action="gtt-question" data-id="${id}">${icon(gClosed(id)?'shieldcheck':'clock')}<span class="row-title">${esc(q.title)}</span>${gPill(id)}${icon('chevron')}</button>`;}).join('');}
function overviewPage(){const s=session(),m=metrics();return header('Confidence starts with <span class="green">discovery.</span>','A guided HALO workspace for presales engineers and architects. Turn customer questions into documented answers—and product assumptions into validation tasks.','YOUR NETWORK HAS MORE TO SHOW YOU',button('New customer','new','','','plus')+button('Guided discovery','interview','','primary','play'))+sessionBar()+statsHTML()+`<div class="overview-layout"><div><div class="two-col gap12"><section class="card">${panelHead('Customer posture to validate '+help('Customer-owned questions','Record the customer’s existing controls, gaps and evidence. The tool does not infer weaknesses from the company name.'),'Ask what exists. Document what is missing.','nav','discovery','All 16 questions')}<div class="compact-list">${compactCustomer(['inventory','configuration','vulnerabilities','eastwest','response','outcomes'])}</div></section><section class="card">${panelHead('GTT / HALO questions '+help('GTT-owned questions','Ask GTT for customer-specific compatibility, operating boundaries and proof. A public product statement does not close these questions.'),'Separate public positioning from proven fit.','nav','readiness','All 14 questions')}<div class="compact-list">${compactGtt(['compatibility','telemetry','safeguards','isolation','residency','proof'])}</div></section></div><div class="note section-space">${icon('book')}<span><strong>Architect’s next question:</strong> ${esc(nextQuestion())}</span></div><div class="section-heading"><div><h2>Four HALO evaluation paths</h2><p>Explore a capability, inspect its prerequisites, then define a customer-specific test.</p></div></div><div class="module-strip">${MODULES.map(o=>`<button class="module-tile" data-action="module" data-id="${o.id}">${icon(o.icon)}<strong>${esc(o.name)}</strong><span>Review scope & prerequisites →</span></button>`).join('')}</div><section class="card section-space">${panelHead('New-customer discovery checklist','Four topics. Sixteen guided questions. Every answer remains editable.','interview','','Start interview')}<div class="card-body"><div class="module-strip" style="margin-top:0">${['Environment','Visibility','Posture & exposure','Authority & outcomes'].map((group,i)=>{const defs=CUSTOMER.filter(q=>q.group===group),n=defs.filter(q=>cAnswered(q.id)).length;return `<button class="module-tile" data-action="discovery-group" data-id="${group}"><span style="color:var(--green);font-size:10px">0${i+1} / ${n} OF ${defs.length} DOCUMENTED</span><strong>${group}</strong><div class="progress"><span style="width:${n/defs.length*100}%;margin:0"></span></div></button>`;}).join('')}</div></div></section></div><aside class="stacked"><section class="card executive-card card-pad"><div class="exec-header">EXECUTIVE EXPERIENCE ${icon('chart')}</div><div class="exec-line">From uncertainty<br>to an <em>informed decision.</em></div><p class="exec-copy">A customer-specific story built from discovery, evidence and a measurable pilot—not a generated risk score.</p><div class="exec-points"><div class="exec-point">${icon('target')}<div>What is the customer trying to improve?<span>${s.outcomes.length?s.outcomes.length+' selected executive outcomes':'Capture the sponsor’s intended outcomes'}</span></div></div><div class="exec-point">${icon('shieldcheck')}<div>What is actually supported?<span>${m.open} GTT questions still need resolution</span></div></div><div class="exec-point">${icon('flag')}<div>What should the pilot prove?<span>${selectedOpps().length} evaluation paths selected</span></div></div></div>${button('Open executive experience','nav','executive','primary full','arrow')}</section><section class="card card-pad"><div class="eyebrow" style="color:var(--muted)">WORKING METHOD</div><h3>Three steps to a credible proposal</h3>${[['Discover','Capture controls, gaps and business priorities.'],['Validate','Ask GTT for support, boundaries and dated evidence.'],['Prove','Agree a safe test with explicit success criteria.']].map(([a,b],i)=>`<div class="mini-step"><div class="step-num">${i+1}</div><div><p>${a}</p><small>${b}</small></div></div>`).join('')}<hr class="divider"><p class="caption">The current stack may already address the need. “No incremental fit” is a valid conclusion.</p>${button('Compare the actual stack','nav','stack','ghost full','layers')}</section></aside></div>`;}
function nextQuestion(){const next=CUSTOMER.find(q=>!cAnswered(q.id));return next?next.question:'Review the open GTT validation items before representing any customer-specific capability as supported.';}
function discoveryPage(){return header('Understand the <span class="green">customer’s reality.</span>','Use the guided prompts to capture the environment, existing controls, posture, authority and business outcomes. An unanswered question remains unknown.','CUSTOMER DISCOVERY',button('Edit profile','profile','','','edit')+button('Guided interview','interview','','primary','play'))+sessionBar()+`<div class="note">${icon('info')}<span><strong>Document, don’t assume.</strong> A “gap” is customer-reported. The status does not independently verify risk, severity or HALO suitability.</span></div><div class="filters" role="group" aria-label="Discovery filters">${['All','Environment','Visibility','Posture & exposure','Authority & outcomes'].map(g=>`<button class="tab ${ui.cGroup===g?'active':''}" data-action="c-group" data-id="${g}">${g}</button>`).join('')}<div class="searchbox">${icon('search')}<input aria-label="Search discovery questions" id="c-search" placeholder="Find a discovery question…" value="${esc(ui.cSearch)}"></div></div><div class="toolbar mb16"><select style="max-width:220px;font-size:11px" aria-label="Filter by answer status" data-bind="c-filter">${options([['all','All answer states'],['unanswered','Not yet documented'],['gaps','Gaps / partial controls'],['answered','Documented answers']],ui.cFilter)}</select><span class="caption" style="align-self:center">${metrics().complete} / ${CUSTOMER.length} documented · Click a card to answer.</span></div><div class="question-grid" id="customer-results">${customerResults()}</div>`;}
function customerResults(){const rows=CUSTOMER.filter(q=>(ui.cGroup==='All'||q.group===ui.cGroup)&&(!ui.cSearch||`${q.title} ${q.question} ${q.group}`.toLowerCase().includes(ui.cSearch.toLowerCase()))&&(ui.cFilter==='all'||ui.cFilter==='unanswered'&&!cAnswered(q.id)||ui.cFilter==='answered'&&cAnswered(q.id)||ui.cFilter==='gaps'&&cAnswered(q.id)&&['gap','partial'].includes(cRecord(q.id).status)));if(!rows.length)return `<div class="empty" style="grid-column:1/-1">${icon('search')}<h3>No questions match this filter</h3><p>Change the topic, status or search text to see more questions.</p></div>`;return rows.map(q=>{const r=cRecord(q.id);return `<section class="card question-card"><div class="question-card-top"><span class="eyebrow">${q.group}</span>${cPill(q.id)}</div><h3>${esc(q.title)} ${help(q.title,q.hint)}</h3><p>${esc(q.question)}</p>${r.answer?`<div class="answered-snippet">${esc(r.answer.length>160?r.answer.slice(0,160)+'…':r.answer)}</div>`:''}<div class="question-card-footer"><small>${icon('user')}${esc(r.owner||q.owner)}</small>${button(cAnswered(q.id)?'Review answer':'Answer & evidence','customer-question',q.id,'sm',cAnswered(q.id)?'edit':'plus')}</div></section>`;}).join('');}
function readinessPage(){const m=metrics();return header('Turn assumptions into <span class="green">evidence.</span>','A separate GTT-owned validation queue. Capture the exact answer, source, accountable owner and review date before marking evidence recorded.','GTT / HALO VALIDATION',button('Product source','sources','','','link')+button('Export question brief','export-gtt','','primary','download'))+`<section class="stats"><div class="card stat"><div class="stat-label">Current evidence ${icon('shieldcheck')}</div><div class="stat-value green">${m.evidence}<small> / ${GTT.length}</small></div><div class="stat-desc">Customer-specific answers recorded</div></div><div class="card stat"><div class="stat-label">Unresolved questions ${icon('clock')}</div><div class="stat-value">${m.open}</div><div class="stat-desc">Open, under review, blocked or stale</div></div><div class="card stat"><div class="stat-label">Unsupported / blocked ${icon('alert')}</div><div class="stat-value">${GTT.filter(q=>gRecord(q.id).status==='unsupported').length}</div><div class="stat-desc">Explicit limitations are preserved</div></div><div class="card stat"><div class="stat-label">Evidence needing refresh ${help('90-day reminder','This application flags recorded evidence older than 90 days for review. It is a configurable-workflow convention, not a GTT validity period or service policy.')}</div><div class="stat-value">${GTT.filter(q=>gRecord(q.id).status==='evidenced'&&isStale(gRecord(q.id))).length}</div><div class="stat-desc">Local 90-day review convention</div></div></section><div class="note warning">${icon('alert')}<span><strong>A public product statement is not a compatibility confirmation.</strong> “Evidence recorded” reflects your entry; this application does not independently authenticate the evidence.</span></div><div class="filters">${['All','Technical fit','Evidence & performance','Governance & authority','Commercial scope'].map(g=>`<button class="tab ${ui.gGroup===g?'active':''}" data-action="g-group" data-id="${g}">${g}</button>`).join('')}<div class="searchbox">${icon('search')}<input aria-label="Search GTT validation questions" id="g-search" placeholder="Find a GTT question…" value="${esc(ui.gSearch)}"></div></div><div class="toolbar mb16"><select style="max-width:230px;font-size:11px" aria-label="Filter GTT validation status" data-bind="g-filter">${options([['all','All validation states'],['open','Unresolved questions'],['evidenced','Current evidence recorded'],['blocked','Unsupported / blocked']],ui.gFilter)}</select></div><div class="question-grid" id="gtt-results">${gttResults()}</div>`;}
function gttResults(){const rows=GTT.filter(q=>(ui.gGroup==='All'||q.group===ui.gGroup)&&(!ui.gSearch||`${q.title} ${q.question}`.toLowerCase().includes(ui.gSearch.toLowerCase()))&&(ui.gFilter==='all'||ui.gFilter==='open'&&!gClosed(q.id)||ui.gFilter==='evidenced'&&gRecord(q.id).status==='evidenced'&&gClosed(q.id)||ui.gFilter==='blocked'&&gRecord(q.id).status==='unsupported'));if(!rows.length)return `<div class="empty" style="grid-column:1/-1">${icon('search')}<h3>No matching validation questions</h3><p>Adjust the search or validation filter.</p></div>`;return rows.map(q=>{const r=gRecord(q.id);return `<section class="card question-card"><div class="question-card-top"><span class="eyebrow">${q.group}${q.critical?' · GATE ITEM':''}</span>${gPill(q.id)}</div><h3>${esc(q.title)}</h3><p>${esc(q.question)}</p>${r.answer?`<div class="answered-snippet">${esc(r.answer.length>160?r.answer.slice(0,160)+'…':r.answer)}</div>`:''}<div class="question-card-footer"><small>${icon('user')}${esc(r.owner||q.owner)}</small>${button('Validate','gtt-question',q.id,'sm','edit')}</div></section>`;}).join('');}
function stackPage(){const s=session();return header('Compare against the <span class="green">actual stack.</span>','Record what the customer uses and how well it addresses the need. HALO is evaluated alongside existing controls—not against an assumed weak “traditional” stack.','SECURITY STACK COMPARISON',button('Add inventory item','asset','','primary','plus'))+`<div class="note warning">${icon('info')}<span><strong>No automatic replacement verdict.</strong> Existing SIEM, NDR, SOAR, EDR and other tools may already provide relevant capabilities. The HALO column is a public-positioning summary; customer-specific support still requires validation.</span></div><section class="card section-space"><div class="table-scroll"><table class="data-table"><thead><tr><th>Control area</th><th>Customer tools & coverage</th><th>Potential HALO role</th><th>Required proof</th></tr></thead><tbody>${STACK.map(row=>{const r=s.stack[row.id]||{};return `<tr><td><strong>${esc(row.title)}</strong><small>${esc(row.retained)}</small></td><td><input aria-label="${esc(row.title)} vendor" placeholder="Customer tool / vendor" maxlength="300" data-stack="${row.id}" data-key="vendor" value="${esc(r.vendor||'')}"><select aria-label="${esc(row.title)} coverage" data-stack="${row.id}" data-key="coverage">${options(COVERAGE,r.coverage||'unknown')}</select></td><td class="fit-col">${esc(row.halo)}<small>Scope and integration unconfirmed.</small></td><td>${esc(row.need)}<div style="margin-top:8px">${button('Add comparison note','stack-note',row.id,'sm ghost','edit')}</div>${r.notes?`<small>${esc(r.notes.slice(0,120))}</small>`:''}</td></tr>`;}).join('')}</tbody></table></div></section><div class="section-heading"><div><h2>Customer-reported inventory</h2><p>Vendor selection or an inventory entry does not establish HALO compatibility.</p></div>${button('Add item','asset','','sm','plus')}</div><section class="card">${s.assets.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Type</th><th>Vendor / product</th><th>Version</th><th>Scope</th><th>Owner</th><th>Actions</th></tr></thead><tbody>${s.assets.map(a=>`<tr><td>${esc(a.category)}</td><td>${esc(a.vendor)}</td><td>${esc(a.version||'Unknown')}</td><td>${esc(a.scope||'Not scoped')}</td><td>${esc(a.owner||'Unassigned')}</td><td><div class="toolbar"><button class="icon-btn" data-action="asset" data-id="${esc(a.id)}" aria-label="Edit ${esc(a.vendor)}">${icon('edit')}</button><button class="icon-btn" data-action="delete-asset" data-id="${esc(a.id)}" aria-label="Remove ${esc(a.vendor)}">${icon('trash')}</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${icon('layers')}<h3>No inventory captured</h3><p>Add known tools, devices or cloud platforms. Keep unknown versions explicit.</p></div>`}</section><div class="caption mt16">Product-role source: <a href="${SOURCE.url}" target="_blank" rel="noopener noreferrer">${esc(SOURCE.title)}</a> · Reviewed ${SOURCE.reviewed}. These summaries are not a supported-product matrix.</div>`;}
function scenarioValues(){const e=session().executive;const valid=e.cases!==''&&e.minutes!=='';const total=valid?Number(e.cases)*Number(e.minutes)/60:null;const hours=total!==null?total*Number(e.reduction)/100:null;const value=hours!==null&&e.rate!==''?hours*Number(e.rate):null;return {hours,total,value};}
function executivePage(){const s=session(),e=s.executive,m=metrics();return header('A decision-ready <span class="green">executive conversation.</span>','Connect the customer’s stated needs to open decisions and a measurable evaluation. The effort model is a user-defined scenario—not a security outcome, ROI claim or HALO performance forecast.','EXECUTIVE EXPERIENCE',button('Preview decision brief','nav','output','primary','file'))+`<div class="two-col"><section class="card card-pad"><div class="exec-header">EXECUTIVE LENS ${icon('users')}</div><h2 style="margin-top:13px">What decision should this support?</h2><div class="field mt16"><label for="exec-audience">Primary audience</label><select id="exec-audience" data-exec="audience">${options(['CISO','CIO','CFO'],e.audience)}</select></div><div id="audience-copy" class="note mt16">${icon('target')}<span>${audienceCopy(e.audience)}</span></div><div class="section-heading" style="margin-bottom:0"><h3>Customer-prioritized outcomes ${help('Explicit executive priorities','Select only outcomes discussed with the customer. These are intended outcomes, not claims that HALO will deliver them.')}</h3></div><div class="outcome-grid">${OUTCOMES.map((o,i)=>`<label class="outcome"><input type="checkbox" data-outcome="${i}" ${s.outcomes.includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div><div class="field mt16"><label for="exec-baseline">Measured baseline and source</label><textarea id="exec-baseline" data-exec="baseline" maxlength="1000" placeholder="e.g., P50 containment time from a dated incident sample; or ‘not measured’">${esc(e.baseline)}</textarea></div><div class="field mt16"><label for="exec-target">Proposed outcome and measurement method</label><textarea id="exec-target" data-exec="target" maxlength="1000" placeholder="e.g., validate a specific use case in a controlled pilot; define start/end measurement boundaries">${esc(e.target)}</textarea></div></section><section class="card card-pad executive-card"><div class="exec-header">EFFORT SCENARIO ${help('Transparent calculation','Hours potentially redeployed per month = cases per month × current minutes per case × target reduction ÷ 60. Labor-capacity value = hours × loaded hourly cost. No breach-loss or cash-savings calculation is made.')}</div><h2 style="margin-top:13px">What could a shorter review cycle mean?</h2><p class="caption" style="margin-top:9px">Enter your own baseline. The reduction slider is an assumption to test—not predicted performance.</p><div class="field-grid mt16"><div class="field"><label for="exec-cases">Reviews / cases per month</label><input id="exec-cases" type="number" min="0" max="10000000" step="1" data-exec="cases" value="${e.cases}" placeholder="Unknown"></div><div class="field"><label for="exec-minutes">Current minutes per review</label><input id="exec-minutes" type="number" min="0" max="100000" step="any" data-exec="minutes" value="${e.minutes}" placeholder="Unknown"></div><div class="field full"><label for="exec-rate">Loaded labor cost per hour (USD, optional)</label><input id="exec-rate" type="number" min="0" max="10000000" step="any" data-exec="rate" value="${e.rate}" placeholder="No value calculation until entered"></div></div><div class="field mt16"><label for="exec-reduction">Hypothesized effort reduction: <strong class="green" id="reduction-label">${e.reduction}%</strong></label><input id="exec-reduction" type="range" min="0" max="90" step="5" data-exec="reduction" value="${e.reduction}"><div style="display:flex;justify-content:space-between" class="caption"><span>0% · No change</span><span>90% · Ambitious hypothesis</span></div></div><div class="scenario-results"><div class="scenario-result"><div class="caption">Potential monthly capacity shift</div><div class="metric-large" id="scenario-hours">${scenarioValues().hours===null?'—':fmt(scenarioValues().hours,1)+' h'}</div><div class="caption">Hours that could be redeployed</div></div><div class="scenario-result"><div class="caption">Monthly labor-capacity equivalent</div><div class="metric-large" id="scenario-value">${scenarioValues().value===null?'—':money(scenarioValues().value)}</div><div class="caption">Not booked or cash savings</div></div></div><div class="note warning mt16">${icon('alert')}<span>${s.demo?'Demo values are fictional. ':''}This model excludes service fees, transition effort, implementation costs and outcome uncertainty. It is not a complete business case.</span></div><div class="field mt16"><label for="exec-notes">Assumptions and caveats</label><textarea id="exec-notes" data-exec="notes" maxlength="5000" placeholder="Record the source of the baseline and who agreed the assumptions.">${esc(e.notes)}</textarea></div></section></div><section class="card section-space">${panelHead('Executive decision signals','Derived from this engagement—not generated exposure, readiness or risk scores.')}<div class="card-body"><div class="three-col"><div><div class="caption">Customer discovery</div><div class="stat-value">${m.gaps} <small>reported gaps</small></div><p class="caption">${m.complete} of ${CUSTOMER.length} questions documented.</p></div><div><div class="caption">Product uncertainty</div><div class="stat-value">${m.open} <small>unresolved questions</small></div><p class="caption">${m.evidence} items have current recorded GTT evidence.</p></div><div><div class="caption">Proposed evaluation</div><div class="stat-value">${selectedOpps().length} <small>selected paths</small></div><p class="caption">${esc(pilotGate().title)}.</p></div></div></div></section>`;}
function audienceCopy(a){return a==='CFO'?'Focus on decision criteria, transparent effort assumptions, total costs still to be confirmed, and evidence required before approving spend.':a==='CIO'?'Focus on visibility boundaries, control ownership, integration effort and the effect of any containment action on critical services.':'Focus on the specific control gap, evidence quality, detection context, authorized response and residual uncertainty.';}
function opportunitiesPage(){return header('Build a <span class="green">testable value hypothesis.</span>','Opportunities are connected to documented discovery signals. There are no fabricated deal scores. Select evaluation paths only where the customer has an actual need.','STRATEGIC OPPORTUNITIES',button('Define selected pilot','nav','pilot','primary','flag'))+`<div class="note">${icon('target')}<span><strong>Candidate ≠ confirmed fit.</strong> A reported gap may justify investigation. Compatibility, data access, operating safeguards and incremental value still need to be demonstrated.</span></div><div class="question-grid section-space">${OPPORTUNITIES.map(o=>{const r=session().opportunities[o.id]||{},sig=opportunitySignal(o);return `<section class="card opp-card ${r.selected?'selected':''}"><div class="opp-top"><div class="opp-icon">${icon(o.icon)}</div>${pill(o.tag)}</div><h2>${esc(o.title)}</h2><p>${esc(o.story)}</p><div class="opp-status">${pill(sig.label,sig.tone)}${pill(sig.count+' documented signal'+(sig.count===1?'':'s'))}</div><div class="note neutral mt16">${icon('shieldcheck')}<span>${sig.proofOpen} of ${o.proof.length} path-specific GTT questions unresolved. Shared governance checks apply to every pilot.</span></div><div class="opp-footer"><label class="select-label"><input type="checkbox" data-opp-select="${o.id}" ${r.selected?'checked':''}>Include in evaluation</label><select aria-label="Priority for ${esc(o.title)}" data-opp-priority="${o.id}">${options(['Low','Medium','High'],r.priority||'Medium')}</select>${button('Explore hypothesis','opportunity',o.id,'sm','arrow')}</div></section>`;}).join('')}</div><div class="note warning section-space">${icon('info')}<span>Finding that the existing stack already meets the need is a valid result. A selected opportunity remains a proposed evaluation—not an approved scope, commitment or sales forecast.</span></div>`;}
function pilotPage(){const p=session().pilot,gate=pilotGate(),selected=selectedOpps();return header('Define what <span class="green">the pilot must prove.</span>','Create a scoped, customer-reviewed evaluation. This workspace cannot authorize collection, execute security actions, or represent that a pilot has started.','PILOT DEFINITION',button('Review GTT evidence','nav','readiness','','shieldcheck')+button('Generate pilot brief','export-pilot','','primary','file'))+`<div class="note ${gate.ready?'':'warning'}">${icon(gate.ready?'check':'alert')}<span><strong>${esc(gate.title)}.</strong> ${gate.ready?'A person must still approve and authorize the pilot.':'Planning completion does not override unresolved product validation or customer authorization.'}</span></div><div class="two-col section-space"><section class="card card-pad"><div class="section-heading" style="margin-top:0"><h2>Proposed scope</h2>${button('Select paths','nav','opportunities','sm ghost','edit')}</div><div class="pill-row mb16">${selected.length?selected.map(o=>pill(o.title,'green')).join(''):pill('No evaluation paths selected','amber')}</div><div class="form-fields"><div class="field"><label for="pilot-scope">Included sites, sources, devices and exclusions</label><textarea id="pilot-scope" data-pilot="scope" maxlength="5000" placeholder="Define the smallest representative scope. Include exact exclusions.">${esc(p.scope)}</textarea></div><div class="field-grid"><div class="field full"><label for="pilot-owner">Accountable pilot owner</label><input id="pilot-owner" data-pilot="owner" maxlength="160" value="${esc(p.owner)}" placeholder="Named GTT / customer owner"></div><div class="field"><label for="pilot-start">Proposed start</label><input type="date" id="pilot-start" data-pilot="start" value="${p.start}"></div><div class="field"><label for="pilot-review">Proposed readout</label><input type="date" id="pilot-review" data-pilot="review" value="${p.review}"></div></div><div class="field"><label for="pilot-criteria">Acceptance criteria & measurement method</label><textarea id="pilot-criteria" data-pilot="criteria" maxlength="5000" placeholder="State what will be measured, how, by whom, and what would count as no incremental value.">${esc(p.criteria)}</textarea></div></div><hr class="divider"><h3>Suggested measures for selected paths</h3>${selected.length?selected.map(o=>`<div class="mini-step">${icon(o.icon)}<div><p>${esc(o.title)}</p><small>${esc(o.metric)}</small></div></div>`).join(''):'<p class="caption mt16">Select an opportunity to see its proposed test measures.</p>'}</section><section class="card card-pad"><h2>Definition checklist</h2><p class="caption" style="margin-top:6px">Checking an item records your planning assertion. It is not approval, a digital signature, or evidence of execution.</p><div>${PILOT_TASKS.map(t=>{const r=p.tasks[t.id]||{};return `<div class="task"><input type="checkbox" id="task-${t.id}" data-task="${t.id}" ${r.done?'checked':''}><label class="task-label" for="task-${t.id}">${esc(t.title)} ${help(t.title,t.help)}<small>${r.done&&!r.owner?'Add the accountable owner to complete the planning gate.':t.help}</small></label><input class="task-owner" aria-label="Owner for ${esc(t.title)}" data-task-owner="${t.id}" maxlength="160" value="${esc(r.owner||'')}" placeholder="Owner"></div>`;}).join('')}</div></section></div><section class="card section-space">${panelHead('Product questions relevant to the selected pilot','Shared governance checks plus the selected paths’ technical prerequisites.','nav','readiness','Open validation queue')}<div class="compact-list">${requiredGtt().length?compactGtt(requiredGtt().map(q=>q.id)):'<div class="empty"><h3>Select an evaluation path first</h3><p>Relevant GTT proof requirements will appear here.</p></div>'}</div></section>`;}
function outputPage(){const s=session();return header('An evidence-led <span class="green">decision brief.</span>','Generate, print or export the current engagement. Customer-view briefs omit internal-only product answers and architect notes, but retain material uncertainty and limitations.','BRIEFS & EVIDENCE',button('Import session','import','','','upload')+button('Export backup','backup','','primary','download'))+`<div class="toolbar"><button class="tab ${ui.briefType==='internal'?'active':''}" data-action="brief-mode" data-id="internal">Internal architect brief</button><button class="tab ${ui.briefType==='customer'?'active':''}" data-action="brief-mode" data-id="customer">Customer decision brief</button><span style="flex:1"></span>${button('Markdown','export-markdown','','sm','download')}${button('HTML brief','export-html','','sm','file')}${button('Print brief','print','','sm','print')}</div><div id="brief-preview">${briefHTML(ui.briefType)}</div><div class="two-col section-space"><section class="card card-pad"><h2>Internal architect notes</h2><p class="caption" style="margin:7px 0 13px">Included in internal exports only. Do not enter secrets or restricted production information.</p><textarea id="architect-notes" maxlength="8000" placeholder="Assumptions, outstanding decisions, next conversation…">${esc(s.notes)}</textarea><div class="toolbar mt16">${button('Refresh brief','refresh-brief','','sm','refresh')}${button('Export GTT question brief','export-gtt','','sm','file')}${button('Export pilot brief','export-pilot','','sm','flag')}</div></section><section class="card card-pad"><h2>Local activity history</h2><p class="caption" style="margin-top:7px">An editable local activity list—not an immutable security audit log.</p><div class="history mt16">${s.history.length?s.history.slice().reverse().slice(0,30).map(h=>`<div class="history-row"><time>${esc(new Date(h.at).toLocaleString())}</time><span>${esc(h.text)}</span></div>`).join(''):'<div class="caption">No recorded activity yet.</div>'}</div></section></div><section class="card card-pad section-space"><div class="section-heading" style="margin:0 0 13px"><div><h2>Workspace management</h2><p>Browser storage is local, not encrypted application storage or tenant-isolated hosting. Export backups regularly.</p></div></div><div class="toolbar">${button('New customer','new','','','plus')}${button('Open fictional demo','demo','','','play')}${button('Save all sessions backup','backup-all','','','save')}${button('Delete current session','delete-session','','danger','trash')}</div></section>`;}
function briefData(mode='internal'){const s=session(),m=metrics(),sc=scenarioValues();const selected=selectedOpps();const reported=CUSTOMER.filter(q=>cAnswered(q.id)&&['gap','partial'].includes(cRecord(q.id).status));return {s,m,sc,selected,reported,customer:mode==='customer'};}
function briefHTML(mode='internal'){const {s,m,sc,selected,reported,customer}=briefData(mode);return `<article class="brief"><div class="brief-meta"><div><div class="eyebrow">GTT DEFENSE HALO · ${customer?'CUSTOMER DECISION BRIEF':'INTERNAL ARCHITECT BRIEF'}</div><div class="caption">Prepared ${esc(new Date().toLocaleDateString())} · Stage: ${esc(s.profile.stage)}</div></div>${pill(s.demo?'FICTIONAL DEMO · NOT CUSTOMER FACTS':'WORKING DRAFT · HUMAN REVIEW','amber')}</div><h2>${esc(s.profile.name)} · HALO evaluation</h2><p>${s.demo?'This is an illustrative engagement using a fictional customer. ':''}The proposed evaluation is based on ${m.complete} documented discovery answers out of ${CUSTOMER.length}. ${m.gaps} gaps and ${m.partial} partially addressed areas are customer-reported${s.demo?' within the fictional scenario':''}; they are not independently verified security findings.</p><h3>1. Intended executive outcomes</h3>${s.outcomes.length?`<ul>${s.outcomes.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:'<p>No executive outcomes have been selected. Confirm priorities with the customer sponsor.</p>'}<p style="margin-top:9px"><strong>Baseline:</strong> ${esc(s.executive.baseline||'Not documented.')}<br><strong>Proposed target / method:</strong> ${esc(s.executive.target||'Not yet defined.')}</p><h3>2. Documented customer context</h3>${reported.length?`<ul>${reported.map(q=>{const r=cRecord(q.id);return `<li><strong>${esc(q.title)} — ${esc(labelOf(C_STATUS,r.status))}:</strong> ${esc(r.answer)}${!customer?`<br><small>Owner: ${esc(r.owner||'Unassigned')} · Source: ${esc(r.evidence||'Not recorded')} · Review date: ${esc(r.date||'Not recorded')}</small>`:''}</li>`;}).join('')}</ul>`:'<p>No documented gaps or partially addressed controls yet. This must not be interpreted as a clean security assessment.</p>'}<h3>3. Current security stack</h3>${STACK.some(q=>session().stack[q.id]?.vendor)?`<ul>${STACK.filter(q=>session().stack[q.id]?.vendor).map(q=>{const r=s.stack[q.id];return `<li><strong>${esc(q.title)}:</strong> ${esc(r.vendor)} — ${esc(labelOf(COVERAGE,r.coverage||'unknown'))}. ${!customer&&r.notes?esc(r.notes):''}</li>`;}).join('')}</ul>`:'<p>Current tool inventory and coverage have not been documented.</p>'}<p style="margin-top:8px">No blanket replacement recommendation has been made. Existing endpoint, identity and other required controls remain in scope for the customer’s security design.</p><h3>4. Proposed evaluation paths</h3>${selected.length?`<ul>${selected.map(o=>`<li><strong>${esc(o.title)}:</strong> ${esc(o.story)}<br>Proposed measure: ${esc(o.metric)}</li>`).join('')}</ul>`:'<p>No evaluation path has been selected. Establish the need before proposing a pilot.</p>'}<h3>5. GTT validation and material limitations</h3><p>${m.evidence} of ${GTT.length} product questions have current recorded evidence; ${m.open} remain unresolved. A recorded answer reflects the presales author’s entry, not independent validation by this application.</p>${customer?`<p style="margin-top:8px">Customer-specific compatibility, telemetry coverage, response permissions, data handling and commercial scope must be confirmed before commitment. Relevant unresolved topics: ${esc(requiredGtt().filter(q=>!gClosed(q.id)).map(q=>q.title).join('; ')||'Review the complete validation record with the account team.')}.</p>`:`<ul>${GTT.map(q=>{const r=gRecord(q.id);return `<li><strong>${esc(q.title)} — ${esc(r.status==='evidenced'&&isStale(r)?'Review overdue':labelOf(G_STATUS,r.status))}:</strong> ${esc(r.answer||q.question)}<br><small>Owner: ${esc(r.owner||q.owner)} · Source: ${esc(r.evidence||'Not recorded')} · Reviewed: ${esc(r.date||'Not recorded')}${r.due?' · Due: '+esc(r.due):''}</small></li>`;}).join('')}</ul>`}<h3>6. Proposed pilot and decision gate</h3><p><strong>Planning state:</strong> ${esc(pilotGate().title)}. This is not permission to begin collection or take action.<br><strong>Scope:</strong> ${esc(s.pilot.scope||'Not defined.')}<br><strong>Acceptance criteria:</strong> ${esc(s.pilot.criteria||'Not defined.')}<br><strong>Accountable owner:</strong> ${esc(s.pilot.owner||'Not assigned.')}<br><strong>Proposed dates:</strong> ${esc(s.pilot.start||'TBD')} to ${esc(s.pilot.review||'TBD')}.</p><h3>7. Effort scenario — assumptions, not forecast</h3>${sc.hours===null?'<p>No complete effort baseline entered. No value estimate has been generated.</p>':`<p>Entered baseline: ${fmt(Number(s.executive.cases))} reviews/month × ${fmt(Number(s.executive.minutes),1)} minutes/review. A hypothesized ${fmt(Number(s.executive.reduction))}% reduction would shift ${fmt(sc.hours,1)} hours/month of capacity${sc.value!==null?', equivalent to '+money(sc.value)+'/month at an entered loaded labor rate of '+money(Number(s.executive.rate))+'/hour':''}. This is potential labor capacity—not cash savings, avoided loss or ROI. Service fees, transition costs and uncertainty are excluded.</p>`}<p style="margin-top:8px">${esc(s.executive.notes||'Assumptions require customer review.')}</p>${!customer?`<h3>8. Internal architect notes</h3><p style="white-space:pre-wrap">${esc(s.notes||'No additional notes recorded.')}</p>`:''}<div class="source-line"><strong>Source and limitations.</strong> Product-role summaries reference <a href="${SOURCE.url}" target="_blank" rel="noopener noreferrer">${esc(SOURCE.title)}</a>, reviewed ${SOURCE.reviewed}. The public source does not validate this customer’s compatibility or outcomes. Discovery and evidence entries are supplied by the presales author. AI-assisted software/content; human validation required. The navigator has no connection to HALO, no telemetry collection and no autonomous response capability.</div></article>`;}

function globalResults(query){const needle=query.trim().toLowerCase();const rows=[...NAV.map(([id,title])=>({kind:'nav',id,title,group:'Workspace'})),...CUSTOMER.map(q=>({kind:'customer-question',id:q.id,title:q.title,group:'Customer · '+q.group,body:q.question})),...GTT.map(q=>({kind:'gtt-question',id:q.id,title:q.title,group:'GTT · '+q.group,body:q.question}))].filter(r=>!needle||`${r.title} ${r.group} ${r.body||''}`.toLowerCase().includes(needle)).slice(0,14);return rows.length?rows.map(r=>`<button class="search-result" data-action="${r.kind}" data-id="${r.id}"><strong>${esc(r.title)}</strong><small>${esc(r.group)}</small></button>`).join(''):'<div class="empty"><h3>No matching question</h3><p>Try a product capability, source or governance term.</p></div>';}
function formData(){const form=document.getElementById('modal-form');if(!form)return null;if(!form.reportValidity())return null;return Object.fromEntries(new FormData(form).entries());}
function formError(message){const el=document.getElementById('modal-error');if(el){el.textContent=message;el.scrollIntoView({block:'nearest'});}}
function saveCustomer(){const data=formData();if(!data)return;const {id,interview}=ui.modal;const status=enumValue(data.status,C_STATUS.map(x=>x[0]),'unknown');if(status!=='unknown'&&!data.answer.trim())return formError('Write the customer’s answer or scope rationale before marking this question documented.');if(data.date&&(!validDate(data.date)||data.date>today()))return formError('Use a valid answer/evidence date that is not in the future.');session().customer[id]={status,answer:txt(data.answer),owner:txt(data.owner,200),evidence:txt(data.evidence,2000),date:data.date||'',due:data.due||''};logChange('Customer discovery updated: '+CUSTOMER.find(q=>q.id===id).title);persist();if(interview){nextInterview();}else{closeModal();render();toast('Discovery answer saved.');}}
function saveGtt(){const data=formData();if(!data)return;const {id}=ui.modal;const status=enumValue(data.status,G_STATUS.map(x=>x[0]),'open');if(data.date&&(!validDate(data.date)||data.date>today()))return formError('Use a valid review date that is not in the future.');if(['review','unsupported','na','evidenced'].includes(status)&&!data.answer.trim())return formError('Record the answer, scope, limitation or reason this item is not applicable.');if(status==='evidenced'&&!gHasProof(data))return formError('Evidence recorded requires an answer, an accountable GTT owner, a source reference and a valid review date.');if(status==='na'&&!data.owner.trim())return formError('Record the owner who determined that this item is not applicable.');session().gtt[id]={status,answer:txt(data.answer),owner:txt(data.owner,200),evidence:txt(data.evidence,2000),date:data.date||'',due:data.due||''};logChange('GTT validation updated: '+GTT.find(q=>q.id===id).title+' — '+labelOf(G_STATUS,status));persist();closeModal();render();toast(status==='evidenced'?'Evidence recorded. Review remains the author’s responsibility.':'GTT validation saved.');}
function nextInterview(){const index=CUSTOMER.findIndex(q=>q.id===ui.modal.id);if(index<CUSTOMER.length-1){ui.interviewIndex=index+1;ui.modal={kind:'customer',id:CUSTOMER[index+1].id,interview:true};render();renderModal();modalRoot.querySelector('select')?.focus();}else{closeModal();navigate('discovery');toast('Interview complete. Unanswered questions remain unknown.');}}
function startInterview(){closeModal();const index=CUSTOMER.findIndex(q=>!cAnswered(q.id));ui.interviewIndex=index<0?0:index;openModal('customer',CUSTOMER[ui.interviewIndex].id,true);}
function saveProfile(){const data=formData();if(!data)return;const name=txt(data.name,160).trim();if(!name)return formError('Enter a customer or company name.');const isNew=ui.modal.kind==='new';if(isNew&&store.sessions.length>=30)return formError('This local workspace supports 30 engagements. Export and remove one before creating another.');if(isNew){const s=blankSession(name);store.sessions.push(s);store.activeId=s.id;}session().profile={name,industry:data.industry,size:data.size,maturity:data.maturity,stage:data.stage,architect:txt(data.architect,160),sponsor:txt(data.sponsor,160),sites:String(cleanNum(data.sites,1000000))};logChange(isNew?'New blank customer engagement created.':'Customer profile updated.');persist();closeModal();if(isNew)navigate('discovery');else render();toast(isNew?'Blank customer engagement created.':'Customer profile saved.');}
function saveAsset(){const data=formData();if(!data)return;const id=ui.modal.id;const a={id:id||uid(),category:data.category,vendor:txt(data.vendor,200).trim(),version:txt(data.version,200),scope:txt(data.scope,400),owner:txt(data.owner,160)};if(!a.vendor)return formError('Enter a vendor or product.');const i=session().assets.findIndex(x=>x.id===id);if(i>=0)session().assets[i]=a;else if(session().assets.length<100)session().assets.push(a);else return formError('The local inventory limit is 100 items.');logChange('Customer inventory '+(id?'updated':'added')+': '+a.vendor);persist();closeModal();render();toast('Inventory saved. Compatibility remains unconfirmed.');}
function saveOpportunity(){const data=formData();if(!data)return;const id=ui.modal.id;session().opportunities[id]={selected:data.selected==='on',priority:enumValue(data.priority,['Low','Medium','High'],'Medium'),notes:txt(data.notes,5000)};logChange('Evaluation hypothesis updated: '+OPPORTUNITIES.find(x=>x.id===id).title);persist();closeModal();render();toast('Evaluation hypothesis saved.');}
function slug(){return session().profile.name.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,70)||'customer';}
function downloadFile(name,contents,mime='text/plain;charset=utf-8'){const blob=new Blob([contents],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Export created: '+name);}
function exportBackup(all=false){persist();const payload=all?{schemaVersion:2,exportedAt:new Date().toISOString(),sessions:store.sessions}:{schemaVersion:2,exportedAt:new Date().toISOString(),session:session()};downloadFile((all?'HALO-all-engagements':slug()+'-HALO-session')+'-'+today()+'.json',JSON.stringify(payload,null,2),'application/json;charset=utf-8');}
function exportGtt(){const s=session();const lines=['# GTT / HALO validation questions',`Customer: ${s.profile.name}${s.demo?' — FICTIONAL DEMO':''}`,`Prepared: ${today()}`,'These are presales questions, not capability claims or authorization.',''];for(const q of GTT){const r=gRecord(q.id);lines.push(`## ${q.title}`,`Status: ${labelOf(G_STATUS,r.status)}${isStale(r)&&r.status==='evidenced'?' (review overdue)':''}`,`Question: ${q.question}`,`Suggested / recorded owner: ${r.owner||q.owner}`,`Evidence to obtain: ${q.needed}`,`Acceptance / boundaries: ${q.accept}`,`Recorded answer: ${r.answer||'Not yet answered'}`,`Source: ${r.evidence||'Not yet recorded'}`,`Review date: ${r.date||'Not recorded'} | Due: ${r.due||'Not set'}`,'');}lines.push(`Public product source: ${SOURCE.url} (reviewed ${SOURCE.reviewed}).`,`AI-assisted framework. Current GTT product validation is required. No HALO systems are connected.`);downloadFile(slug()+'-GTT-validation-questions.md',lines.join('\n\n'),'text/markdown;charset=utf-8');}
function exportPilot(){const s=session(),p=s.pilot;const lines=['# HALO proposed pilot definition',`Customer: ${s.profile.name}${s.demo?' — FICTIONAL DEMO':''}`,`Planning state: ${pilotGate().title}`,'This document does not authorize data collection or response actions.',`Selected evaluation paths: ${selectedOpps().map(o=>o.title).join(', ')||'None'}`,`Scope: ${p.scope||'Not defined'}`,`Accountable owner: ${p.owner||'Not assigned'}`,`Proposed dates: ${p.start||'TBD'} to ${p.review||'TBD'}`,`Acceptance criteria: ${p.criteria||'Not defined'}`,'## Planning checklist',...PILOT_TASKS.map(t=>`[${p.tasks[t.id]?.done?'x':' '}] ${t.title} — Owner: ${p.tasks[t.id]?.owner||'Unassigned'}`),'## Proposed tests',...selectedOpps().map(o=>`${o.title}\n${o.test}\nMeasure: ${o.metric}`),'## Remaining GTT product validation',...requiredGtt().filter(q=>!gClosed(q.id)).map(q=>`${q.title}: ${q.question}`),'AI-assisted working draft. Human review, customer authority and current GTT support confirmation are required.'];downloadFile(slug()+'-HALO-pilot-definition.md',lines.join('\n\n'),'text/markdown;charset=utf-8');}
async function importFile(file){if(!file)return;if(file.size>MAX_IMPORT_BYTES)return toast('Import rejected: JSON backups must be smaller than 3 MB.',true);try{const raw=JSON.parse(await file.text());if(raw.schemaVersion!==SCHEMA_VERSION)throw new Error('Unsupported backup version. Use a HALO Navigator v2 JSON export.');const items=Array.isArray(raw.sessions)?raw.sessions:raw.session?[raw.session]:[];if(!items.length)throw new Error('No sessions found in this backup.');if(items.length+store.sessions.length>30)throw new Error('Import would exceed the 30-engagement local limit.');const imported=items.map(normalizeSession);for(const s of imported){s.id=uid();s.history.push({at:new Date().toISOString(),text:'Session imported from a local JSON backup.'});}store.sessions.push(...imported);store.activeId=imported[0].id;persist();closeModal();navigate('overview');toast(`${imported.length} engagement${imported.length===1?'':'s'} imported as new local copies.`);}catch(error){toast('Import rejected: '+error.message,true);}}
function refreshScenario(){const sc=scenarioValues();const h=document.getElementById('scenario-hours'),v=document.getElementById('scenario-value'),r=document.getElementById('reduction-label');if(h)h.textContent=sc.hours===null?'—':fmt(sc.hours,1)+' h';if(v)v.textContent=sc.value===null?'—':money(sc.value);if(r)r.textContent=session().executive.reduction+'%';}
function showTooltip(el){hideTooltip();if(!el)return;const tip=document.createElement('div');tip.className='tooltip';tip.id='active-tooltip';tip.setAttribute('role','tooltip');tip.innerHTML=`<strong>${esc(el.dataset.tipTitle||'Architect guidance')}</strong>${esc(el.dataset.tip||'')}`;document.body.appendChild(tip);el.setAttribute('aria-describedby','active-tooltip');tooltipAnchor=el;const box=el.getBoundingClientRect();const rect=tip.getBoundingClientRect();let left=Math.min(Math.max(12,box.left-30),window.innerWidth-rect.width-12);let top=box.bottom+9;if(top+rect.height>window.innerHeight-12)top=Math.max(12,box.top-rect.height-9);tip.style.left=left+'px';tip.style.top=top+'px';}
function hideTooltip(){document.getElementById('active-tooltip')?.remove();tooltipAnchor?.removeAttribute('aria-describedby');tooltipAnchor=null;}
function askDeleteAsset(id){const a=session().assets.find(x=>x.id===id);if(!a)return;if(confirm('Remove the inventory item “'+a.vendor+'” from this engagement?')){session().assets=session().assets.filter(x=>x.id!==id);logChange('Removed a customer inventory item.');persist();render();toast('Inventory item removed.');}}
function removeSession(){const deleted=session().profile.name;store.sessions=store.sessions.filter(s=>s.id!==store.activeId);if(!store.sessions.length)store.sessions.push(blankSession('New customer'));store.activeId=store.sessions[0].id;persist();closeModal();navigate('overview');toast('Deleted local engagement: '+deleted);}
function loadDemo(){const existing=store.sessions.find(s=>s.demo);if(existing)store.activeId=existing.id;else{if(store.sessions.length>=30)return toast('Export and remove an engagement before adding a demo.',true);const d=demoSession();store.sessions.push(d);store.activeId=d.id;}persist();closeModal();navigate('overview');toast('Fictional demonstration session opened.');}
/* Delegated events keep dynamic pages and dialogs interactive without global

 case 'demo':loadDemo();break;

 }

document.addEventListener('input',event=>{
 const el=event.target,s=session();

 if(el.id==='g-search'){ui.gSearch=el.value;document.getElementById('gtt-results').innerHTML=gttResults();return;}
 if(el.id==='global-search'){document.getElementById('global-results').innerHTML=globalResults(el.value);return;}
 if(el.dataset.stack){const id=el.dataset.stack,key=el.dataset.key;if(!STACK.some(r=>r.id===id)||!['vendor','coverage'].includes(key))return;s.stack[id]={...(s.stack[id]||{vendor:'',coverage:'unknown',notes:''}),[key]:txt(el.value,300)};scheduleSave();return;}
 if(el.dataset.exec){const key=el.dataset.exec;if(['cases','minutes','rate','reduction'].includes(key))s.executive[key]=cleanNum(el.value,key==='reduction'?90:key==='minutes'?100000:10000000);else if(['audience','baseline','target','notes'].includes(key))s.executive[key]=txt(el.value,key==='notes'?5000:1000);refreshScenario();scheduleSave();return;}
 if(el.dataset.pilot){const key=el.dataset.pilot;if(['scope','owner','criteria'].includes(key))s.pilot[key]=txt(el.value,key==='owner'?160:5000);scheduleSave();return;}
 if(el.dataset.taskOwner){const id=el.dataset.taskOwner;if(!PILOT_TASKS.some(t=>t.id===id))return;s.pilot.tasks[id]={...(s.pilot.tasks[id]||{done:false}),owner:txt(el.value,160)};scheduleSave();return;}
 if(el.id==='architect-notes'){s.notes=txt(el.value);scheduleSave();}
});
